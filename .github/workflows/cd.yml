name: CD

on:
  push:
    branches: [ main ]

# Só um deploy por vez; um novo merge espera o anterior terminar
concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write          # necessário para o Workload Identity Federation

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/aprovacoes/api:${{ github.sha }}

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Autenticar o Docker no Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build da imagem
        run: docker build -t "$IMAGE" .

      - name: Push da imagem
        run: docker push "$IMAGE"

  deploy-staging:
    needs: build-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: aprovacoes-api-staging
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated --max-instances=1

      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.url }}/health"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production        # espera sua aprovação
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: aprovacoes-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated --max-instances=1

      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.url }}/health"